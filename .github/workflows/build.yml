name: Build Android Plugin AARs

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AARs
        run: ./gradlew assemble

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: androidiapp-aars
          path: |
            AndroidIAPP/build/outputs/aar/AndroidIAPP-release.aar
            AndroidIAPP/build/outputs/aar/AndroidIAPP-debug.aar
